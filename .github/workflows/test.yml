name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Identical circuits pass
        id: same
        uses: ./
        with:
          old: testdata/reference.qasm
          new: testdata/reference.qasm

      - name: Drifted circuit fails
        id: drift
        continue-on-error: true
        uses: ./
        with:
          old: testdata/reference.qasm
          new: testdata/drifted.qasm

      - name: Assert outcomes
        shell: bash
        run: |
          test "${{ steps.same.outputs.changed }}" = "false"
          test "${{ steps.drift.outcome }}" = "failure"
          test "${{ steps.drift.outputs.changed }}" = "true"
